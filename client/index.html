<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giritharan Mani | Software Development Engineer II</title>
    <meta
      name="description"
      content="Giritharan Mani is a Software Development Engineer II in Bengaluru who turns messy workflows into products people use every day, from discovery to production."
    />
    <meta name="theme-color" content="#0b0c0f" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Giritharan Mani | Software Development Engineer II" />
    <meta
      property="og:description"
      content="SDE II and product-minded engineer. 10+ products shipped to production, used daily by 120+ people."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("gm-theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
